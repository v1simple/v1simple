name: CI

# One authoritative gate per public main revision. Development branches remain
# local-only; a successful push-origin run is the only input to Release.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v1replay-swift-oracle:
    name: v1replay Swift oracle
    runs-on: macos-15
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run v1replay Swift tests
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
          CLANG_MODULE_CACHE_PATH: ${{ github.workspace }}/tools/v1replay/.build/module-cache
          SWIFTPM_MODULECACHE_OVERRIDE: ${{ github.workspace }}/tools/v1replay/.build/module-cache
        run: swift test --package-path tools/v1replay

      - name: Check native camera recorder
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
        run: |
          mkdir -p tools/v1replay/.build/camera-module-cache
          xcrun swiftc -warnings-as-errors -module-cache-path tools/v1replay/.build/camera-module-cache -typecheck scripts/bench/camera_recorder.swift
          xcrun swift -module-cache-path tools/v1replay/.build/camera-module-cache scripts/bench/camera_recorder.swift --self-test-timing
          xcrun swift -module-cache-path tools/v1replay/.build/camera-module-cache scripts/bench/camera_recorder.swift --self-test-writer
          xcrun swift -module-cache-path tools/v1replay/.build/camera-module-cache scripts/bench/camera_recorder.swift --self-test-raw-frames

  test:
    name: ci-test.sh
    runs-on: ubuntu-24.04
    timeout-minutes: 36

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: 'npm'
          cache-dependency-path: interface/package-lock.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini', 'scripts/patch_*.py', 'scripts/verify_esp32s3_framework.py', 'scripts/check_platformio_core_version.py') }}

      - name: Bootstrap Linux validation environment
        run: |
          set -o pipefail
          ./scripts/bootstrap_linux_validation.sh ci 2>&1 | tee linux-bootstrap.log

      - name: Run ci-test.sh
        env:
          PLATFORMIO_RUN_JOBS: '1'
        run: |
          python3 scripts/check_platformio_core_version.py --pio pio
          python3 scripts/check_esptool_version.py --python python3
          set -o pipefail
          bash ./scripts/ci-test.sh 2>&1 | tee ci-test.log

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-test-log-${{ github.sha }}
          path: |
            linux-bootstrap.log
            ci-test.log
            .artifacts/linux-validation-environment.txt
            .artifacts/test_reports
          include-hidden-files: true
          retention-days: 14
